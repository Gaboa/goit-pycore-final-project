name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: requirements-dev.txt
          args: check .
      - name: Check Ruff formatting
        run: ruff format --check .
